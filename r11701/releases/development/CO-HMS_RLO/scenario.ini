; CO-HMS_RLO grid type of release development (MESA r11701)
; Paths are relative to the release folder (releases/v2.0/);
; ZAMS models are relative to r11701/.

[grid_type]
name = CO-HMS_RLO
description = a compact object and a hydrogen-rich star from ZAMS
star1 = zams
star2 = point_mass

[inlists]
; target = files, applied in order; a later file wins key by key.
; 'binary', 'star1' and 'star2' feed &controls and &star_job
; (&binary_controls and &binary_job); formation steps likewise.
binary = common/binary/inlist_project, CO-HMS_RLO/binary/inlist_project
star1 = common/binary/inlist1, CO-HMS_RLO/binary/inlist1
star2 = common/binary/inlist2, CO-HMS_RLO/binary/inlist2

[columns]
history_columns = common/history_columns.list
binary_history_columns = common/binary_history_columns.list
profile_columns = common/profile_columns.list

[extras]
; legacy [mesa_extras] key = Fortran source
posydon_binary_extras = common/binary/src/run_binary_extras.f
posydon_star_binary_extras = common/binary/src/run_star_extras.f
mesa_star1_extras = common/binary/src/run_star_extras.f

[zams]
; none: the ini's zams_filename names the ZAMS model
